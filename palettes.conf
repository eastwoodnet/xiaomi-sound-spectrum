# ==============================================================================
# 小米 Sound (L06A) 音乐声光律动调色板与主题配置文件
# 存放路径: /data/palettes.conf
# 
# 修改后生效方式:
#   1. 终端执行: touch /tmp/reload_palette (毫秒级无缝热生效，音乐不中断)
#   2. 或在 Home Assistant 中直接下拉切换主题
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. 全局预设主题 (THEME)
# 可选值:
#   rainbow   - 🌈 经典多频段全彩光谱 (默认，高保真声学频段映射)
#   cyberpunk - 🌆 赛博朋克霓虹 (霓虹粉紫 + 极电明青 + 白炽峰值)
#   ocean     - 🌊 深海冰蓝 (深夜魅蓝 + 蔚蓝天空 + 翡翠海浪)
#   fire      - 🔥 炽热烈焰 (血月猩红 + 烈火纯红 + 烈阳赤橙 + 琥珀金核)
#   aurora    - 🌌 极光秘境 (荧光青翠 + 碧水青绿 + 极光幽紫)
#   custom    - 🎨 自定义调色板 (加载下方各个模式的精细配置)
# ------------------------------------------------------------------------------
THEME = rainbow

# ------------------------------------------------------------------------------
# 2. 完全自定义调色板 (当 THEME = custom 时生效，色彩支持标准 #RRGGBB)
# ------------------------------------------------------------------------------

# [模式 1: 天使之翼] (双翼 8 频段声学均衡器，左翼与右翼对称，由低音到高音)
MODE1_BAND0 = #FF0000   # 频段 0: 超低音 (Sub-Bass) - 烈焰深红
MODE1_BAND1 = #FF4500   # 频段 1: 低音瞬态 (Bass Punch) - 烈阳火橙
MODE1_BAND2 = #FFB500   # 频段 2: 中低频 (Low Mids) - 琥珀金黄
MODE1_BAND3 = #30FF00   # 频段 3: 核心中频人声 (Midrange) - 荧光青翠
MODE1_BAND4 = #00FFFF   # 频段 4: 中高频泛音 (High Mids) - 赛博明青
MODE1_BAND5 = #0075FF   # 频段 5: 存在打击感 (Presence) - 天空湛蓝
MODE1_BAND6 = #5000FF   # 频段 6: 明亮高频 (Treble) - 极电靛蓝
MODE1_BAND7 = #FF40FF   # 频段 7: 极高频空气感 (Air) - 极光粉紫

MODE1_TOP_BASS   = #FF0020   # 顶部 LED 0 纯正低音鼓爆发脉冲色
MODE1_BOT_TREBLE = #FFFFFF   # 底部 LED 9 极高频瞬态碰撞高光色

# [模式 2: 低音怒火] (前置爆发双翼展开 + 动态能量质心色温)
MODE2_BASS_COLOR   = #FF0000   # 重低音占主导时的爆发色温 (烈焰红)
MODE2_MID_COLOR    = #00FFB5   # 中频主唱占主导时的律动色温 (赛博青)
MODE2_TREBLE_COLOR = #0080FF   # 明亮高频占主导时的冲击色温 (天空蓝)
MODE2_PEAK_COLOR   = #FFFFFF   # 悬停峰值点颜色 (纯白)
MODE2_BG_COLOR     = #020010   # 待机未点亮通道的深紫微光底色

# [模式 3: 流动熔岩 与 模式 5: 极速光轮] (HSV 色相限制: 0-3600，3600对应360度)
# 若全色域流动设置为 0 和 3600；若火山熔岩设为 0 和 600；若冰蓝极光设为 1600 和 2400
MODE3_HUE_MIN = 0
MODE3_HUE_MAX = 3600
# 模式 5 (极速光轮) 默认自动复用 MODE3_HUE_MIN/MAX，也可单独指定 MODE5_HUE_MIN / MODE5_HUE_MAX

# [模式 4: 全频 18 频段基准配色环] (顺时针 18 颗灯珠基准色，支持逗号分隔的 18 个 #RRGGBB)
MODE4_COLORS = #FF0000, #FF3000, #FF6000, #FFA000, #FFD000, #A0FF00, #00FF30, #00FF90, #00FFE0, #00E0FF, #0090FF, #0040FF, #2000FF, #7000FF, #C000FF, #FF00E0, #FF0080, #FF0030
