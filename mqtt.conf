# ==============================================================================
# 小米 Sound (L06A) Home Assistant MQTT 远端控制配置文件
# 存放路径: /data/mqtt.conf
# ==============================================================================

# MQTT Broker 主机地址 (默认局域网主路由)
MQTT_HOST="192.168.1.1"

# MQTT Broker 端口
MQTT_PORT="1883"

# 认证用户名 (无认证请留空)
MQTT_USER=""

# 认证密码 (无认证请留空)
MQTT_PASS=""

# 是否启用 MQTT 远端控制 (1 = 启用, 0 = 禁用)
MQTT_ENABLED="1"
